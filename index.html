<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Orientation Overlay - index.html</title>
  <style>
    /* --- ページ基本レイアウト（必要に応じて既存スタイルに合わせて調整） --- */
    html,body { height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; background:#f6f7f9; color:#222; }
    main { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }

    /* --- デモ用コンテンツ（既存アプリがある場合は置き換えてください） --- */
    .app {
      width:100%;
      max-width:900px;
      background: #fff;
      border-radius:12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      padding:24px;
      box-sizing:border-box;
    }
    h1 { margin:0 0 12px 0; font-size:20px; }
    p { margin:0 0 12px 0; color:#444; }

    /* --- オーバーレイ（角度表示・線） --- */
    #overlay {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 99999;
      pointer-events: none;
      font-family: sans-serif;
      color: #222;
      background: rgba(255,255,255,0.92);
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .angle-box { margin-bottom:6px; font-size:14px; }
    .angle-label { font-weight:700; margin-right:6px; }

    /* 線の共通 */
    .line {
      position: fixed;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      pointer-events: none;
      z-index: 99998;
    }

    /* 緑の水平線（可変長） */
    #hLine {
      height: 4px;
      background: limegreen;
      width: 220px;
      margin-left: -110px;
      margin-top: -2px;
      transition: width 120ms linear, background-color 120ms linear, transform 80ms linear;
      box-shadow: 0 0 8px rgba(0,128,0,0.18);
      border-radius: 2px;
    }

    /* グレーの補助横線（長め） */
    #gLine {
      height: 2px;
      background: #999;
      width: 320px;
      margin-left: -160px;
      margin-top: -1px;
      opacity: 0.95;
      transition: width 120ms linear, opacity 120ms linear, background-color 120ms linear;
      border-radius: 1px;
    }

    /* グレーの補助縦線（ランドスケープ用） */
    #gLineV {
      width: 2px;
      height: 320px;
      margin-left: -1px;
      margin-top: -160px;
      background: #999;
      opacity: 0.95;
      transition: height 120ms linear, opacity 120ms linear, background-color 120ms linear;
      display: none;
      border-radius: 1px;
    }

    /* 近接時の色変化（赤） */
    .near { background: red !important; box-shadow: 0 0 10px rgba(255,0,0,0.28) !important; }

    /* 補助的な説明（小画面で邪魔なら非表示に） */
    @media (max-width:420px){
      #overlay { left:8px; top:8px; padding:6px 8px; font-size:13px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="app" role="main" aria-label="Demo app">
      <h1>Orientation Overlay Demo</h1>
      <p>このファイルはスマホの傾きを可視化するためのサンプルです。スマホ実機で開いて動作を確認してください。</p>
      <p>水平は <strong>0°</strong>、垂直は <strong>90°</strong> を基準に表示します。±1° に入ると色が変わります。</p>
      <p>既存のアプリがある場合は、このファイル内のオーバーレイブロック（コメント ORIENTATION-OVERLAY）を該当箇所に統合してください。</p>
    </div>
  </main>

  <!-- ORIENTATION-OVERLAY-START -->
  <div id="overlay" aria-hidden="true">
    <div class="angle-box"><span class="angle-label">水平 H</span><span id="hVal">0°</span></div>
    <div class="angle-box"><span class="angle-label">垂直 V</span><span id="vVal">90°</span></div>
  </div>

  <div id="hLine" class="line" aria-hidden="true"></div>
  <div id="gLine" class="line" aria-hidden="true"></div>
  <div id="gLineV" class="line" aria-hidden="true"></div>

  <script>
    /*
      ORIENTATION-OVERLAY SCRIPT
      - 既存の deviceorientation ハンドラをこのブロックで置き換えてください
      - 水平を 0°, 垂直を 90° として扱い、±1° に入ったら色を変えます
      - 水平付近で被らないように緑線とグレー線の長さを動的に変えます
      - 横向き（ランドスケープ）時は縦グレー線を表示します
    */

    (function(){
      // 要素参照
      const hLine = document.getElementById('hLine');
      const gLine = document.getElementById('gLine');
      const gLineV = document.getElementById('gLineV');
      const hVal = document.getElementById('hVal');
      const vVal = document.getElementById('vVal');

      // 閾値（度）
      const THRESH = 1.0;

      // 角度ユーティリティ
      function to360(a){ return (a % 360 + 360) % 360; }
      function shortestDistance(a,b){ let d = Math.abs(a-b) % 360; return d>180 ? 360-d : d; }

      // H/V 計算（左右対称で水平=0、垂直=90）
      function computeHV(rawPitch, rawRoll){
        const p360 = to360(rawPitch);
        // 垂直度合い: 90 または 270 に近いほど「立っている」
        const distTo90 = Math.min(shortestDistance(p360, 90), shortestDistance(p360, 270)); // 0..180
        // distTo90=0 -> vertical=90, distTo90=90 -> vertical=0
        const vertical = Math.max(0, Math.min(90, 90 - distTo90));

        // 水平は roll の絶対値を使う（左右とも 0 にする）
        const rAbs = Math.min(90, Math.abs(rawRoll || 0)); // 0..90
        const horizontal = rAbs; // 0..90

        return { horizontal, vertical };
      }

      // UI 更新
      function updateUI(h, v, rawRoll){
        hVal.textContent = Math.round(h) + '°';
        vVal.textContent = Math.round(v) + '°';

        // 色変更: 水平が 0±THRESH なら緑線を赤に
        if (h <= THRESH) hLine.classList.add('near'); else hLine.classList.remove('near');

        // 垂直が 90±THRESH ならグレー線を赤に
        if (Math.abs(v - 90) <= THRESH) {
          gLine.classList.add('near');
          gLineV.classList.add('near');
        } else {
          gLine.classList.remove('near');
          gLineV.classList.remove('near');
        }

        // 緑線の回転: rawRoll の符号を反映して左右どちらでも水平=0 に見えるようにする
        const rot = rawRoll || 0;
        hLine.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;

        // グレー横線は常に横向き（補助線）
        gLine.style.transform = `translate(-50%,-50%) rotate(0deg)`;
        gLineV.style.transform = `translate(-50%,-50%) rotate(0deg)`;

        // 線の長さを動的に調整して被りを避ける
        // 水平付近では緑線を短く、グレー線を長くする
        const hLen = Math.max(80, 220 - (200 * Math.exp(- (h*h) / 50 ))); // 80..220
        const gLen = Math.max(120, 320 + (120 * Math.exp(- (h*h) / 200 ))); // 120..440
        hLine.style.width = `${hLen}px`;
        hLine.style.marginLeft = `${-hLen/2}px`;
        gLine.style.width = `${gLen}px`;
        gLine.style.marginLeft = `${-gLen/2}px`;

        // ランドスケープ判定: rawRoll の絶対値が 45° を超えたら横向きとみなす
        const isLandscape = Math.abs(rawRoll || 0) > 45;
        if (isLandscape) {
          gLineV.style.display = 'block';
          // 縦線の長さをランドスケープ時に少し伸ばす
          const vLen = Math.max(200, gLen);
          gLineV.style.height = `${vLen}px`;
          gLineV.style.marginTop = `${-vLen/2}px`;
          gLine.style.opacity = 0.6;
        } else {
          gLineV.style.display = 'none';
          gLine.style.opacity = 0.95;
        }
      }

      // deviceorientation イベントハンドラ（既存のものと置き換える）
      window.addEventListener('deviceorientation', function(ev){
        // ev.beta: pitch (-180..180), ev.gamma: roll (-90..90)
        const rawPitch = (typeof ev.beta === 'number') ? ev.beta : 0;
        const rawRoll  = (typeof ev.gamma === 'number') ? ev.gamma : 0;

        // H/V を計算
        const { horizontal: H, vertical: V } = computeHV(rawPitch, rawRoll);

        // 更新
        updateUI(H, V, rawRoll);
      }, true);

      // 初期表示
      updateUI(0, 90, 0);
    })();
  </script>
  <!-- ORIENTATION-OVERLAY-END -->
</body>
</html>
